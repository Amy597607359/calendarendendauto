<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>动态日历 · 云端版</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --p:#2563eb; --pd:#1d4ed8; --tb:#dbeafe; --tbd:#3b82f6; --dn:#10b981;
  --bg:#f1f5f9; --card:#ffffff; --border:#bfdbfe; --text:#1e3a8a; --sub:#1e40af;
}
*{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);margin:0;padding:6px;font-size:14px}
.app{background:var(--card);border-radius:14px;box-shadow:0 10px 24px rgba(0,20,30,.10);padding:12px}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
h1{font-size:1.05rem;color:var(--pd);margin:0}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select,.btn,input[type=number],input[type=time],input[type=text],input[type=color]{
  padding:8px 10px;border-radius:9px;border:1.5px solid #cbd5e1;font-size:16px;
  outline:none;cursor:pointer;background:var(--card);font-family:inherit;color:var(--text);
  -webkit-appearance:none;appearance:none;
}
select:focus,input:focus{border-color:var(--p)}
input[type=number]{width:78px;cursor:text;text-align:center}
input[type=time]{width:110px;cursor:text}
.btn{background:var(--p);color:#fff;border:none;font-weight:500}
.btn:active{background:var(--pd)}
.btn.ghost{background:var(--card);color:var(--pd);border:1.5px solid #cbd5e1}
.btn.sm{padding:5px 10px;font-size:.78rem}
.btn.cloud{background:#0ea5e9;color:#fff}
.btn.cloud:active{background:#0284c7}

.row{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.cal{flex:3 1 100%;min-width:0;display:flex;flex-direction:column}
.side{flex:1 1 100%;min-width:0;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column}
@media (min-width:820px){
  .cal{flex:3 1 600px}
  .side{flex:1 1 320px;min-width:300px;height:calc(100vh - 220px);overflow-y:auto}
}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.wk div{text-align:center;font-size:.78rem;font-weight:600;color:var(--sub);background:var(--border);padding:6px 0;border-radius:14px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:4px;flex:1;min-height:520px}
.grid.week{display:flex;overflow-x:auto;gap:8px;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.grid.week .cell.weekday{flex:0 0 72vw;max-width:280px}
.cell{background:var(--card);border:1.5px solid var(--border);border-radius:9px;min-height:56px;padding:5px;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;user-select:none;transition:background .15s}
.cell:active{background:var(--bg)}
.cell.other{color:#93c5fd;background:color-mix(in srgb, var(--card) 92%, var(--border));font-weight:400}
.cell.today{background:var(--tb);border:2px solid var(--tbd);font-weight:700}
.cell.sel{border:2px solid var(--p)!important;box-shadow:0 0 0 3px color-mix(in srgb, var(--p) 30%, transparent)}
.cell.drag-over{border:2px dashed var(--p)!important;background:color-mix(in srgb, var(--p) 12%, var(--card))}
.cell.weekday{min-height:280px;flex-direction:column;gap:4px;align-items:stretch}
.cell.weekday .dnum{font-size:.95rem;flex-direction:row;align-items:center;justify-content:space-between;min-width:0}
.cell.weekday .wbody{flex:1;min-width:0;overflow-y:auto}
.dnum{font-size:.85rem;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:3px;flex-wrap:wrap}
.badge{font-size:.6rem;background:var(--p);color:#fff;border-radius:10px;padding:0 5px}
.badge.all-done{background:var(--dn)}
.pv{font-size:.68rem;color:var(--sub);margin-top:3px;overflow:hidden;line-height:1.25;flex:1}
.cell-task{display:flex;align-items:center;gap:3px;margin-top:2px;font-size:.68rem;line-height:1.25;color:var(--text);border-radius:5px;padding:1px 2px;cursor:grab;touch-action:manipulation}
.cell-task:hover{background:color-mix(in srgb, var(--p) 8%, var(--card))}
.cell-task.dragging{opacity:.4;cursor:grabbing}
.cell-task .ct-check{flex-shrink:0;width:14px;height:14px;margin:0;accent-color:var(--p);cursor:pointer}
.cell-task .ct-time{flex-shrink:0;font-size:.62rem;color:var(--p);font-weight:600}
.cell-task .ct-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-task.done .ct-text{text-decoration:line-through;color:#93c5fd}
.cell-task .ct-tag{flex-shrink:0;width:3px;height:10px;border-radius:2px;background:#94a3b8}
.cell-task .ct-repeat{flex-shrink:0;font-size:.6rem;color:var(--p)}
.side h2{font-size:.92rem;color:var(--pd);margin:0 0 8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.dlabel{font-size:.7rem;background:var(--border);padding:2px 8px;border-radius:10px;color:var(--sub)}
.pbox{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px}
.ptitle{font-size:.76rem;font-weight:600;color:var(--sub);margin-bottom:6px;display:flex;justify-content:space-between}
.ptitle button{background:none;border:none;color:var(--p);font-size:.72rem;text-decoration:underline;cursor:pointer}
.prow{display:flex;gap:6px;flex-wrap:wrap}
.prow select{flex:1;min-width:120px;padding:7px 9px;font-size:16px}
.prow .btn{padding:7px 12px;font-size:.82rem}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:10px;min-height:60px}
.item{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 10px;flex-wrap:wrap}
.item.done .txt{text-decoration:line-through;color:#93c5fd}
.item input[type=checkbox]{accent-color:var(--p);flex-shrink:0;width:18px;height:18px}
.txt{flex:1;font-size:.88rem;color:var(--text);word-break:break-word;min-width:100px}
.item .time-badge{font-size:.7rem;background:var(--tb);color:#92400e;padding:1px 6px;border-radius:8px;font-weight:600}
.item .tag-select{font-size:16px;padding:3px 6px;border-radius:6px;border:1px solid #cbd5e1;background:var(--card);cursor:pointer;color:var(--text)}
.del{background:none;border:none;color:#93c5fd;font-size:1rem;cursor:pointer;flex-shrink:0;padding:2px 6px}
.del:active{color:#ef4444}
.addrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.addrow input[type=text]{flex:1;min-width:120px;padding:9px 10px;border:1.5px solid #cbd5e1;border-radius:9px;font-size:16px}
.addrow .btn{padding:0 14px;font-size:.88rem;min-height:40px}
.addrow .time-pick{padding:8px;font-size:16px;width:auto}
.addrow .tag-pick{padding:8px;font-size:16px;border-radius:8px;border:1.5px solid #cbd5e1;background:var(--card)}
.panel{display:none;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:8px;max-height:340px;overflow-y:auto}
.panel.show{display:block}
.pitem{display:flex;align-items:center;gap:6px;padding:5px 4px;border-bottom:1px dashed var(--border)}
.pitem input{flex:1;padding:7px 9px;border:1.5px solid #cbd5e1;border-radius:7px;font-size:16px}
.pitem button{background:none;border:none;color:#93c5fd;font-size:1rem;cursor:pointer;padding:4px 8px}
.padd{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.padd input{flex:1;min-width:110px;padding:8px 9px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:16px}
.padd select{flex:1;min-width:100px;padding:8px 9px;border-radius:8px;font-size:16px}
.padd button{padding:0 12px;font-size:.82rem}
.tag-row{display:flex;align-items:center;gap:6px;padding:6px 4px;border-bottom:1px dashed var(--border)}
.tag-dot{width:22px;height:22px;border-radius:6px;flex-shrink:0;cursor:pointer;border:1.5px solid #fff;box-shadow:0 0 0 1px #cbd5e1}
.tag-row input{flex:1;padding:7px 9px;border:1.5px solid #cbd5e1;border-radius:7px;font-size:16px}
.tag-row button{background:none;border:none;color:#93c5fd;font-size:1rem;cursor:pointer;padding:4px 8px}
.empty{color:#93c5fd;font-size:.8rem;text-align:center;padding:10px 0}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:.8rem;color:var(--p);flex-wrap:wrap;gap:8px}
.tinfo{background:var(--border);padding:5px 12px;border-radius:20px;border:1px solid var(--border);color:var(--pd);font-weight:500}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--pd);color:#fff;padding:10px 18px;border-radius:20px;font-size:.85rem;opacity:0;transition:.3s;pointer-events:none;z-index:9999;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.stats{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.ring-wrap{position:relative;width:120px;height:120px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg);display:block}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--pd)}
.ring-label .num{font-size:1.4rem;font-weight:700}
.ring-label .cap{font-size:.68rem;color:var(--p)}
.stats-info{flex:1;min-width:200px}
.stats-info h3{margin:0 0 8px;font-size:.92rem;color:var(--pd)}
.stats-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.84rem;color:var(--text);border-bottom:1px dashed var(--border)}
.bar{height:10px;background:var(--border);border-radius:10px;overflow:hidden;margin-top:6px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--p),color-mix(in srgb, var(--p) 70%, #fff));transition:width .5s}
.repeat-box{margin-top:10px;font-size:.8rem;color:var(--sub)}
.repeat-hint{font-size:.7rem;color:var(--p);margin-top:4px}
.repeat-days{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.repeat-days span{padding:6px 12px;border-radius:8px;background:var(--border);cursor:pointer;font-size:.8rem;user-select:none;border:1.5px solid transparent;color:var(--text)}
.repeat-days span.on{background:var(--p);color:#fff;border-color:var(--pd)}
.year-input{width:78px;padding:8px 8px;border-radius:9px;border:1.5px solid #cbd5e1;font-size:16px;text-align:center;font-weight:600;color:var(--pd)}

.pgroup{margin-bottom:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg)}
.pgroup-head{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:color-mix(in srgb, var(--border) 60%, var(--card));font-size:.78rem;font-weight:600;color:var(--pd);gap:6px}
.pgroup-head .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgroup-head .acts{display:flex;gap:4px;flex-shrink:0}
.pgroup-head .acts button{background:none;border:none;color:var(--p);font-size:.7rem;cursor:pointer;padding:2px 4px;text-decoration:underline}
.pgroup-body{padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px}
.preset-chip{background:var(--card);border:1px solid var(--border);padding:6px 8px;border-radius:14px;font-size:.78rem;color:var(--text);display:flex;align-items:center;gap:4px;cursor:pointer}
.preset-chip:active{background:var(--p);color:#fff}
.preset-chip .chip-txt{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preset-chip .chip-btn{cursor:pointer;padding:0 2px;opacity:.55;font-size:.75rem;flex-shrink:0}
.preset-chip .chip-btn:hover{opacity:1}
.preset-chip .chip-btn.edit:hover{color:#3b82f6}
.preset-chip .chip-btn.move:hover{color:#7c3aed}
.preset-chip .chip-btn.del:hover{color:#e11d48}

.color-panel{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;padding:10px;background:var(--card);border-radius:10px;border:1px solid var(--border)}
.color-item{display:flex;flex-direction:column;gap:2px;align-items:center;font-size:.7rem;color:var(--sub)}
.color-item input[type=color]{width:44px;height:40px;border-radius:8px;padding:0;cursor:pointer;border:1.5px solid #cbd5e1}

.sheet-mask{position:fixed;inset:0;background:rgba(30,20,60,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9998;padding:0}
@media (min-width:600px){.sheet-mask{align-items:center;padding:20px}}
.sheet{background:var(--card);border-radius:16px 16px 0 0;padding:18px 18px 24px;width:100%;max-width:440px;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
@media (min-width:600px){.sheet{border-radius:16px}}
.sheet h3{margin:0 0 12px;font-size:1rem;color:var(--pd)}
.sheet .row-input{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.sheet .row-input input,.sheet .row-input select{padding:11px 12px;font-size:16px;border-radius:10px;border:1.5px solid #cbd5e1}
.sheet-btns{display:flex;gap:8px;flex-wrap:wrap}
.sheet-btns .btn{flex:1;min-width:100px;padding:12px;font-size:.9rem}
.hint{font-size:.72rem;color:var(--sub);margin-top:6px;line-height:1.4}

.cloud-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbd5e1;margin-right:4px;vertical-align:middle}
.cloud-dot.on{background:#10b981;box-shadow:0 0 6px #10b981}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1>📅 动态日历 · 云端版 <span class="cloud-dot" id="cloudDot" title="云端状态"></span></h1>
    <div class="toolbar">
      <input type="number" id="yearInput" class="year-input" min="1900" max="2999" step="1">
      <select id="monthSel"></select>
      <button class="btn ghost" id="viewToggle">📆 周视图</button>
      <button class="btn cloud" id="cloudSyncBtn" title="拉取云端 → 合并 → 上传（2次请求）">☁️ 同步云端</button>
      <button class="btn cloud" id="cloudSaveBtn" title="只上传本地到云端（1次请求）">⬆️ 保存到云</button>
      <button class="btn ghost" id="exportBtn">⬇️ 导出</button>
      <button class="btn ghost" id="importBtn">📥 导入</button>
      <input type="file" id="importFile" accept=".xlsx,.xls" style="display:none">
      <button class="btn ghost" id="themePanelToggle">🎨 主题</button>
    </div>
  </div>

  <div id="themePanel" class="panel" style="margin-bottom:14px;max-height:420px">
    <div style="font-weight:600;margin-bottom:8px;color:var(--pd)">🎨 自定义配色（实时生效）</div>
    <div class="color-panel">
      <div class="color-item"><span>主色</span><input type="color" id="cP" value="#2563eb"></div>
      <div class="color-item"><span>深主色</span><input type="color" id="cPD" value="#1d4ed8"></div>
      <div class="color-item"><span>今日背景</span><input type="color" id="cTB" value="#dbeafe"></div>
      <div class="color-item"><span>今日边框</span><input type="color" id="cTBD" value="#3b82f6"></div>
      <div class="color-item"><span>完成色</span><input type="color" id="cDN" value="#10b981"></div>
      <div class="color-item"><span>页面背景</span><input type="color" id="cBG" value="#f1f5f9"></div>
      <div class="color-item"><span>卡片背景</span><input type="color" id="cCard" value="#ffffff"></div>
      <div class="color-item"><span>边框色</span><input type="color" id="cBorder" value="#bfdbfe"></div>
      <div class="color-item"><span>主文字</span><input type="color" id="cText" value="#1e3a8a"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center">
      <button class="btn" id="applyCustomColors">应用并保存</button>
      <button class="btn ghost" id="resetTheme">恢复默认（蓝色）</button>
    </div>
  </div>

  <div class="row">
    <div class="cal">
      <div class="wk" id="wk"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="side">
      <h2>📋 任务 <span class="dlabel" id="dlabel">点击日期</span></h2>

      <div class="pbox">
        <div class="ptitle"><span>🎨 标签管理</span><button id="togTagPanel">管理</button></div>
        <div class="panel" id="tagPanel">
          <div id="tagList"></div>
          <div class="padd">
            <input id="newTagName" placeholder="标签名" maxlength="20">
            <input type="color" id="newTagColor" value="#3b82f6" style="width:42px;height:38px;padding:0;border:1.5px solid #cbd5e1;border-radius:7px;cursor:pointer">
            <button class="btn" id="newTagBtn">添加</button>
          </div>
        </div>
      </div>

      <div class="pbox">
        <div class="ptitle"><span>⚡ 预设任务（分类）</span><button id="togPanel">管理</button></div>
        <div class="prow">
          <select id="presetSel"></select>
          <button class="btn" id="addPreset">添加</button>
        </div>
        <div class="panel" id="panel">
          <div id="presetList"></div>
          <div class="padd" style="margin-top:12px;border-top:1px dashed var(--border);padding-top:10px">
            <input id="newPreset" placeholder="新增预设任务…" maxlength="30">
            <select id="newPresetGroup"></select>
            <button class="btn" id="newPresetBtn">添加预设</button>
          </div>
          <div class="padd" style="margin-top:6px">
            <input id="newGroupName" placeholder="新分类名称…" maxlength="20">
            <button class="btn ghost" id="newGroupBtn">新建分类</button>
          </div>
          <div class="hint">💡 chip 上的 ✎ 改文字，⇄ 换分类，✕ 删除。点 chip 本体填入输入框。</div>
        </div>
      </div>

      <div class="list" id="list"></div>

      <div class="addrow">
        <input type="text" id="taskInput" placeholder="输入任务…" maxlength="60">
        <input type="time" id="taskTime" class="time-pick">
        <select id="taskTag" class="tag-pick"><option value="">无标签</option></select>
        <button class="btn" id="addBtn">添加</button>
      </div>

      <div class="repeat-box">
        <div style="font-weight:600">🔁 每周重复</div>
        <div class="repeat-days" id="repeatDays">
          <span data-d="1">一</span><span data-d="2">二</span><span data-d="3">三</span>
          <span data-d="4">四</span><span data-d="5">五</span><span data-d="6">六</span>
          <span data-d="0">日</span>
        </div>
        <div class="repeat-hint">输入任务名或选预设后，点星期几设为重复</div>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="ring-wrap">
      <svg width="120" height="120" viewBox="0 0 150 150">
        <circle cx="75" cy="75" r="65" fill="none" stroke="var(--border)" stroke-width="14"></circle>
        <circle id="ringFg" cx="75" cy="75" r="65" fill="none" stroke="var(--p)" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 999"></circle>
      </svg>
      <div class="ring-label"><div class="num" id="ringNum">0%</div><div class="cap">完成度</div></div>
    </div>
    <div class="stats-info">
      <h3>📊 当前月统计（<span id="statsMonth"></span>）</h3>
      <div class="stats-row"><span>任务总数</span><b id="stTotal">0</b></div>
      <div class="stats-row"><span>已完成</span><b id="stDone">0</b></div>
      <div class="stats-row"><span>未完成</span><b id="stUndone">0</b></div>
      <div class="stats-row"><span>有任务天数</span><b id="stDays">0</b></div>
      <div class="bar" style="margin-top:10px"><div id="stBar" style="width:0%"></div></div>
    </div>
  </div>

  <div class="foot"><div class="tinfo" id="tinfo"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var monthSel=$('monthSel'),yearInput=$('yearInput'),grid=$('grid'),wk=$('wk'),listEl=$('list'),dlabel=$('dlabel'),presetSel=$('presetSel');
  var taskInput=$('taskInput'),tinfo=$('tinfo'),toast=$('toast');
  var togPanel=$('togPanel'),panel=$('panel'),presetList=$('presetList');
  var newPreset=$('newPreset'),newPresetBtn=$('newPresetBtn'),newPresetGroup=$('newPresetGroup');
  var newGroupName=$('newGroupName'),newGroupBtn=$('newGroupBtn');
  var ringFg=$('ringFg'),ringNum=$('ringNum'),statsMonth=$('statsMonth');
  var stTotal=$('stTotal'),stDone=$('stDone'),stUndone=$('stUndone'),stDays=$('stDays'),stBar=$('stBar');
  var viewToggle=$('viewToggle'),repeatDays=$('repeatDays');
  var taskTime=$('taskTime'),taskTag=$('taskTag');
  var togTagPanel=$('togTagPanel'),tagPanel=$('tagPanel'),tagList=$('tagList');
  var newTagName=$('newTagName'),newTagColor=$('newTagColor'),newTagBtn=$('newTagBtn');
  var themePanelToggle=$('themePanelToggle'),themePanel=$('themePanel');

  // ===== 云端配置（改这里）=====

  function deleteTaskLinked(k,id){

    var idx=-1;
    for(var i=0;i<list.length;i++){ if(list[i].id===id){ idx=i; break; } }
    if(idx<0)return;
    var text=list[idx].text;
    var rule=repeats[text];
    var isRepeat=rule && rule.days && rule.days.length;

    if(isRepeat){
      confirmDeleteDialog(text).then(function(choice){
        if(choice==='cancel')return;

          if(arr){
            var pos=-1;
            for(var j=0;j<arr.length;j++){ if(arr[j].id===id){ pos=j; break; } }
            if(pos>=0) arr.splice(pos,1);
            if(arr.length===0) delete tasks[k];
          }
          if(!rule.skips) rule.skips={};
          rule.skips[k]=true;
          saveRepeats();
          toastMsg('已删除「'+text+'」');

          Object.keys(tasks).forEach(function(kk){

      var arr3=tasks[k];
      var pos2=-1;
      for(var n=0;n<arr3.length;n++){ if(arr3[n].id===id){ pos2=n; break; } }
      if(pos2<0)return;

      save(TKEY,tasks);

  function collectAllData(){

      tasks: tasks, presets: presets, groups: groups,

  function mergeTasks(localT, cloudT){
    var out = {};
    var allKeys = {};
    Object.keys(localT||{}).forEach(function(k){ allKeys[k]=1; });
    Object.keys(cloudT||{}).forEach(function(k){ allKeys[k]=1; });
    Object.keys(allKeys).forEach(function(k){
      var map = {};
      (localT[k]||[]).forEach(function(t){ if(t&&t.id) map[t.id]=t; });
      (cloudT[k]||[]).forEach(function(t){
        if(!t||!t.id) return;
        var exist = map[t.id];
        if(!exist){ map[t.id]=t; }
        else {
          var a = exist.upd||0, b = t.upd||0;
          if(b>a) map[t.id]=t;
          else if(b===a){
            if(t.done && !exist.done){ exist.done=true; map[t.id]=exist; }
          }
        }
      });
      var arr = Object.keys(map).map(function(id){ return map[id]; });
      if(arr.length) out[k]=arr;
    });
    return out;
  }

  function mergeSimpleArray(a,b,keyFn){
    var out=[], seen={};
    (a||[]).forEach(function(x){ var k=keyFn(x); if(!seen[k]){seen[k]=1;out.push(x);} });
    (b||[]).forEach(function(x){ var k=keyFn(x); if(!seen[k]){seen[k]=1;out.push(x);} });
    return out;
  }

  function mergeRepeats(a,b){
    var out={};
    function norm(v){ if(Array.isArray(v)) return {days:v.slice(),skips:{}}; return v||{days:[],skips:{}}; }
    var keys={};
    Object.keys(a||{}).forEach(function(k){keys[k]=1;});
    Object.keys(b||{}).forEach(function(k){keys[k]=1;});
    Object.keys(keys).forEach(function(k){
      var ra=norm(a&&a[k]), rb=norm(b&&b[k]);
      var daysArr = mergeSimpleArray(
        (ra.days||[]).map(function(d){return {d:d};}),
        (rb.days||[]).map(function(d){return {d:d};}),
        function(x){return x.d;}
      ).map(function(x){return x.d;});
      var skips = Object.assign({}, ra.skips||{}, rb.skips||{});
      out[k]={days:daysArr, skips:skips};
    });
    return out;
  }

  function applyMergedData(cloud){
    if(!cloud || typeof cloud!=='object') throw new Error('云端数据格式不对');
    tasks = mergeTasks(tasks, cloud.tasks||{});
    save(TKEY,tasks);
    presets = mergeSimpleArray(presets, cloud.presets, function(p){
      return (p&&p.text||'')+'||'+(p&&p.group||'');
    });
    groups = mergeSimpleArray(
      groups.map(function(g){return {g:g};}),
      (cloud.groups||[]).map(function(g){return {g:g};}),
      function(x){return x.g;}
    ).map(function(x){return x.g;});
    tags = mergeSimpleArray(tags, cloud.tags, function(t){ return t&&t.name||''; });
    repeats = mergeRepeats(repeats, cloud.repeats||{});
    savePresets(); saveGroups(); saveTags(); saveRepeats();
    if(cloud.theme){ applyThemeVars(cloud.theme); saveCustomTheme(cloud.theme); }
    renderTagPanel(); renderTagSelect(); render();
  }

  function importExcel(file){
    if(typeof XLSX==='undefined'){toastMsg('Excel库未加载');return;}
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var data=new Uint8Array(e.target.result);
        var wb=XLSX.read(data,{type:'array'});
        var sheetName = wb.SheetNames.indexOf('任务明细')>=0 ? '任务明细' : wb.SheetNames[0];
        var ws=wb.Sheets[sheetName];
        var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        var added=0,skipped=0;
        for(var i=1;i<rows.length;i++){
          var r=rows[i];
          if(!r || !r[0] || !r[2]) continue;
          var k=String(r[0]).trim();
          if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
          var text=String(r[2]).trim();
          var done=(String(r[3]).trim()==='已完成');
          var tag=r[5]!==undefined ? String(r[5]).trim() : '';
          if(tag){
            var ex=false;
            for(var ti=0;ti<tags.length;ti++){ if(tags[ti].name===tag){ex=true;break;} }
            if(!ex){tags.push({name:tag,color:'#94a3b8'});saveTags();}
          }
          if(!tasks[k]) tasks[k]=[];
          var dup=false;
          for(var j=0;j<tasks[k].length;j++){ if(tasks[k][j].text===text){dup=true;break;} }
          if(dup){skipped++;continue;}
          tasks[k].push({id:uid(),text:text,done:done,time:'',tag:tag,upd:Date.now()});
          added++;
        }
        save(TKEY,tasks);
        renderTagPanel();renderTagSelect();render();
        toastMsg('已导入 '+added+' 条，跳过 '+skipped+' 条');
      }catch(err){toastMsg('导入失败：'+err.message);}
    };
    reader.readAsArrayBuffer(file);
  }

  function exportExcel(){
    if(typeof XLSX==='undefined'){toastMsg('Excel库未加载');return;}
    var prefix=curY+'-'+String(curM+1).padStart(2,'0')+'-';
    var daysData=[];
    Object.keys(tasks).sort().forEach(function(k){if(k.indexOf(prefix)===0)daysData.push({key:k,list:tasks[k]||[]});});
    if(!daysData.length){toastMsg('本月没有任务');return;}
    var w=['周日','周一','周二','周三','周四','周五','周六'],label=curY+'年'+(curM+1)+'月';
    var detail=[['日期','星期','任务内容','状态','当日完成度','标签']],total=0,dn=0;
    daysData.forEach(function(day){
      var p=day.key.split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]);
      var dd=day.list.filter(function(t){return t.done;}).length;
      var rate=day.list.length?dd+'/'+day.list.length:'0/0';
      day.list.forEach(function(t){detail.push([day.key,w[dt.getDay()],t.text,t.done?'已完成':'未完成',rate,t.tag||'']);});
      total+=day.list.length;dn+=dd;
    });
    var summary=[['日期','星期','任务数','已完成','完成度']];
    daysData.forEach(function(day){
      var p=day.key.split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]);
      var dd=day.list.filter(function(t){return t.done;}).length;
      var rate=day.list.length?Math.round(dd/day.list.length*100)+'%':'0%';
      summary.push([day.key,w[dt.getDay()],day.list.length,dd,rate]);
    });
    var tr=total?Math.round(dn/total*100)+'%':'0%';
    summary.push(['合计','',total,dn,tr]);
    var overview=[['统计项','数值'],['导出范围',label],['任务总数',total],['已完成',dn],['未完成',total-dn],['整体完成度',tr],['导出时间',fmtD(new Date())]];
    var wb=XLSX.utils.book_new();

    ws1['!cols']=[{wch:12},{wch:6},{wch:36},{wch:10},{wch:12},{wch:10}];

    ws3['!cols']=[{wch:14},{wch:20}];
    XLSX.utils.book_append_sheet(wb,ws1,'任务明细');
    XLSX.utils.book_append_sheet(wb,ws2,'每日汇总');
    XLSX.utils.book_append_sheet(wb,ws3,'总览');
    XLSX.writeFile(wb,'日历任务_'+curY+String(curM+1).padStart(2,'0')+'.xlsx');
    toastMsg('已导出 '+label+'，共 '+total+' 条');

  taskInput.addEventListener('input',function(){repeatTarget=taskInput.value.trim();refreshRepeatDays();});
  presetSel.addEventListener('change',function(){
    if(presetSel.value==='__CLEAR__'){repeatTarget='';refreshRepeatDays();return;}
    if(taskInput.value.trim()) return;
    var i=presetSel.value;
    if(i===''||i==null){repeatTarget='';refreshRepeatDays();return;}
    var p=presets[+i];
    if(p) repeatTarget=p.text; else repeatTarget='';
    refreshRepeatDays();
  });
  repeatDays.querySelectorAll('span').forEach(function(sp){
    sp.onclick=function(){
      var d=+sp.dataset.d;
      var txt=taskInput.value.trim();
      if(!txt && presetSel.value!=='__CLEAR__'){
        var i=presetSel.value;
        if(i!=='' && i!=null){ var p=presets[+i]; if(p) txt=p.text; }
      }
      if(!txt){toastMsg('请输入任务名，或选一个预设');return;}
      if(!repeats[txt])repeats[txt]={days:[],skips:{}};
      if(!Array.isArray(repeats[txt].days)) repeats[txt].days=[];
      var idx=repeats[txt].days.indexOf(d);
      if(idx>=0)repeats[txt].days.splice(idx,1);else repeats[txt].days.push(d);
      if(!repeats[txt].days.length) delete repeats[txt];
      saveRepeats();
      repeatTarget=txt;
      sp.classList.toggle('on');
      toastMsg('已设置重复：'+txt);
      render();
    };
  });

  $('addPreset').onclick=function(){
    if(presetSel.value==='__CLEAR__'){toastMsg('请先选一个预设');return;}
    var i=presetSel.value;if(i===''||i==null)return;
    var p=presets[+i]; if(!p) return;
    var txt=p.text;
    var rule=repeats[txt];
    if(rule && rule.days && rule.days.length){toastMsg('已设为重复：'+txt);render();return;}
    var tm=taskTime?taskTime.value:'';
    var tg=taskTag?taskTag.value:'';
    if(addTask(selKey(),txt,tm,tg)){toastMsg('已添加：'+txt);if(taskTime)taskTime.value='';}
  };
  $('addBtn').onclick=function(){
    var v=taskInput.value.trim();
    var tm=taskTime?taskTime.value:'';
    var tg=taskTag?taskTag.value:'';
    if(v&&addTask(selKey(),v,tm,tg)){taskInput.value='';if(taskTime)taskTime.value='';}
  };
  taskInput.onkeydown=function(e){
    if(e.key==='Enter'){
      var v=taskInput.value.trim();
      var tm=taskTime?taskTime.value:'';
      var tg=taskTag?taskTag.value:'';
      if(v&&addTask(selKey(),v,tm,tg)){taskInput.value='';if(taskTime)taskTime.value='';}
    }
  };
  togPanel.onclick=function(){panel.classList.toggle('show');togPanel.textContent=panel.classList.contains('show')?'收起':'管理';};

  newPresetBtn.onclick=function(){
    var v=newPreset.value.trim();
    if(!v) return;
    if(!groups.length){ toastMsg('请先新建一个分类'); return; }
    var g=newPresetGroup.value;
    if(!g){ toastMsg('请选择分类'); return; }
    for(var i=0;i<presets.length;i++){
      if(presets[i].text===v && presets[i].group===g){ toastMsg('该分类下已有同名预设'); return; }
    }
    presets.push({text:v, group:g});
    savePresets();
    newPreset.value='';
    renderPresetSelect(); renderPresetPanel();
    toastMsg('已添加预设到「'+g+'」');
  };
  newPreset.onkeydown=function(e){ if(e.key==='Enter') newPresetBtn.click(); };

  newGroupBtn.onclick=function(){
    var v=newGroupName.value.trim();
    if(!v){ toastMsg('请输入分类名称'); return; }
    if(groups.indexOf(v)>=0){ toastMsg('分类已存在'); return; }
    groups.push(v);
    saveGroups();
    newGroupName.value='';
    renderPresetSelect(); renderPresetGroupOptions(); renderPresetPanel();
    if(newPresetGroup) newPresetGroup.value=v;
    toastMsg('已新建分类「'+v+'」');
  };
  newGroupName.onkeydown=function(e){ if(e.key==='Enter') newGroupBtn.click(); };

  if(togTagPanel){
    togTagPanel.onclick=function(){
      tagPanel.classList.toggle('show');
      togTagPanel.textContent=tagPanel.classList.contains('show')?'收起':'管理';
    };
  }
  if(newTagBtn) newTagBtn.onclick=addNewTag;
  if(newTagName) newTagName.onkeydown=function(e){ if(e.key==='Enter')addNewTag(); };

  if(themePanelToggle){
    themePanelToggle.onclick=function(){ themePanel.classList.toggle('show'); };
  }
  if($('applyCustomColors')){
    $('applyCustomColors').onclick=function(){
      var t=currentThemeFromInputs();
      applyThemeVars(t); saveCustomTheme(t); render();
      toastMsg('主题已保存');
    };
  }
  if($('resetTheme')){
    $('resetTheme').onclick=function(){
      applyThemeVars(DEF_THEME); saveCustomTheme(DEF_THEME); render();
      toastMsg('已恢复默认蓝色');
    };
  }
  ['cP','cPD','cTB','cTBD','cDN','cBG','cCard','cBorder','cText'].forEach(function(id){
    if($(id)) $(id).addEventListener('input', function(){
      applyThemeVars(currentThemeFromInputs());
    });
  });

  if(typeof Notification!=='undefined' && Notification.permission==='default'){
    document.addEventListener('click',function once(){
      try{Notification.requestPermission();}catch(e){}
      document.removeEventListener('click',once);
    });
  }

  renderMonths();renderYear();
  renderPresetSelect();renderPresetGroupOptions();
  renderTagPanel();renderTagSelect();
  renderPresetPanel();
  dlabel.textContent=fmtSel(selDate);
  tinfo.textContent='📌 今日：'+fmtD(today)+' ('+['周日','周一','周二','周三','周四','周五','周六'][today.getDay()]+')';
  render();
})();
</script>
</body>
</html>
